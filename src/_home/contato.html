<section id="contato"{{ calc.v.contato | raw }} style="background: var(--c-principal); color: var(--c-principal-txt);">
<div style="max-width: 1240px; margin: 0 auto; padding: 88px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 40px;">
<div style="flex: 1 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 16px;">
<h2 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: clamp(38px, 5vw, 60px); line-height: 1; text-transform: uppercase;">{{ home.contato.titulo }}</h2>
<p class="rt" style="margin: 0; font-size: 19px; line-height: 1.6; color: #e1efe3;">{{ home.contato.texto | rt }}</p>
</div>
<div style="flex: 0 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 14px;">
<a class="btn-main" href="https://wa.me/{{ wa }}" style="background: var(--c-destaque); color: var(--c-destaque-txt); text-decoration: none; font-weight: 700; font-size: 20px; padding: 20px 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; gap: 12px;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.4A8.4 8.4 0 1 1 21 11.5z"></path></svg>
{{ whatsapp }}</a>
<div class="contact-links" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;">
<a href="{{ instagram_url }}" target="_blank" rel="noopener" style="display: inline-flex; align-items: center; gap: 8px; color: #ffffff; text-decoration: none; font-weight: 600; font-size: 16px; padding: 12px 16px; border: 1.5px solid rgba(255,255,255,0.45); border-radius: 8px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.6" fill="currentColor"/></svg>@{{ instagram }}</a>
<a href="{{ google }}" target="_blank" rel="noopener" style="display: inline-flex; align-items: center; gap: 8px; color: #ffffff; text-decoration: none; font-weight: 600; font-size: 16px; padding: 12px 16px; border: 1.5px solid rgba(255,255,255,0.45); border-radius: 8px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Ver no Google</a>
<a href="mailto:{{ email }}" style="display: inline-flex; align-items: center; gap: 8px; color: #ffffff; text-decoration: none; font-weight: 600; font-size: 16px; padding: 12px 16px; border: 1.5px solid rgba(255,255,255,0.45); border-radius: 8px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>E-mail</a>
</div>
</div>
</div>
</section>
