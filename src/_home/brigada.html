<section id="brigada"{{ calc.v.brigada | raw }} style="background: #14201a; color: #ffffff;">
<div style="max-width: 1240px; margin: 0 auto; padding: 96px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 56px;">
<div class="brig-media" style="flex: 1 1 420px; min-width: 0;">
<img loading="lazy" src="{{ home.brigada.imagem | img }}" alt="{{ home.brigada.imagem_descricao }}" style="width: 100%; height: 520px; object-fit: cover; border-radius: 10px; display: block;">
</div>
<div style="flex: 1 1 460px; min-width: 0; display: flex; flex-direction: column; gap: 24px;">
<div style="font-weight: 700; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--c-destaque);">{{ home.brigada.etiqueta }}</div>
<h2 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: clamp(36px, 4.5vw, 54px); line-height: 1; text-transform: uppercase;">{{ home.brigada.titulo }}</h2>
<p class="rt" style="margin: 0; font-size: 18px; line-height: 1.6; color: #c9d3cb;">{{ home.brigada.texto | rt }}</p>
<div style="display: flex; flex-direction: column; gap: 12px;">
{{#each home.brigada.niveis as nivel}}
<div class="brig-row" style="display: flex; align-items: center; justify-content: space-between; gap: 16px; border: 1px solid #34443a; border-radius: 8px; padding: 18px 22px;"><span style="font-weight: 700; font-size: 19px;">{{ nivel.nome }}</span><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 28px; color: var(--c-destaque); white-space: nowrap;">{{ nivel.horas }}</span></div>
{{/each}}
</div>
<a class="btn-main" href="https://wa.me/{{ wa }}" style="align-self: flex-start; background: var(--c-destaque); color: var(--c-destaque-txt); text-decoration: none; font-weight: 700; font-size: 17px; padding: 16px 26px; border-radius: 6px;">{{ home.brigada.botao }}</a>
</div>
</div>
</section>
