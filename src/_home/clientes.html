<section id="clientes" style="background: var(--alt); border-bottom: 1px solid var(--line);">
<div style="max-width: 1240px; margin: 0 auto; padding: 36px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 20px 40px;">
<div style="font-weight: 700; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);">{{ home.faixa_clientes.titulo }}</div>
<div class="marquee" style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 36px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 26px; color: var(--ink2); text-transform: uppercase; letter-spacing: 0.02em;">
{{ calc.logos | raw }}
</div>
<a href="clientes.html" style="font-weight: 700; font-size: 15px; padding: 10px 0;">{{ home.faixa_clientes.link }}</a>
</div>
</section>
