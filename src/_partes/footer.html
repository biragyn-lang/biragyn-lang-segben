<footer style="background: var(--c-escura); color: #b9cbbd;">
<div style="max-width: 1240px; margin: 0 auto; padding: 40px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 20px; font-size: 14px;">
<div style="display: flex; align-items: center; gap: 16px;">
<div style="background: #ffffff; border-radius: 6px; padding: 6px 10px;"><img loading="lazy" src="{{ identidade.logo | img }}" alt="Segbem" style="height: 40px; width: auto; display: block;"></div>
<span>{{ identidade.rodape }}</span>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px;">
<a href="{{ instagram_url }}" target="_blank" rel="noopener" style="display: inline-flex; align-items: center; gap: 6px; color: #e1efe3; text-decoration: none; padding: 10px 0;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.6" fill="currentColor"/></svg>@{{ instagram }}</a>
<a href="{{ google }}" target="_blank" rel="noopener" style="display: inline-flex; align-items: center; gap: 6px; color: #e1efe3; text-decoration: none; padding: 10px 0;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Como chegar</a>
<a href="mailto:{{ email }}" style="display: inline-flex; align-items: center; gap: 6px; color: #e1efe3; text-decoration: none; padding: 10px 0;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>{{ email }}</a>
<span>CNPJ {{ cnpj }}</span>
<span style="flex-basis: 100%; text-align: left;" class="addr">{{ endereco_completo }}</span>
</div>
</div>
</footer>
