<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="{{ home.seo.descricao | txt }}">
<meta property="og:title" content="{{ home.seo.titulo }}">
<meta property="og:description" content="{{ home.seo.descricao | txt }}">
<meta property="og:image" content="https://segbemsst.com.br/img/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://segbemsst.com.br/">
<meta property="og:locale" content="pt_BR">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://segbemsst.com.br/">
<script type="application/ld+json">{"@context": "https://schema.org", "@type": "ProfessionalService", "name": "Segbem Assessoria em Segurança do Trabalho", "legalName": "SEGBEM ASSESSORIA EM SEGURANCA DO TRABALHO LTDA", "url": "https://segbemsst.com.br/", "image": "https://segbemsst.com.br/img/og.jpg", "logo": "https://segbemsst.com.br/{{ identidade.logo | img }}", "telephone": {{ ld_telefone | json }}, "email": {{ email | json }}, "taxID": {{ cnpj | json }}, "address": {"@type": "PostalAddress", "streetAddress": {{ endereco | json }}, "addressLocality": {{ cidade | json }}, "addressRegion": {{ uf | json }}, "postalCode": {{ cep | json }}, "addressCountry": "BR"}, "areaServed": [{"@type": "State", "name": "Goiás"}, {"@type": "State", "name": "Tocantins"}, {"@type": "State", "name": "Maranhão"}, {"@type": "State", "name": "Mato Grosso"}], "sameAs": [{{ instagram_url | json }}], "knowsAbout": ["Segurança do trabalho", "Higiene ocupacional", "Treinamentos de NR", "Implantação da NR-01", "PGR", "LTCAT", "PCMSO", "CIPA", "SIPAT", "eSocial SST", "Brigada de emergência", "Lei Lucas"]}</script>
{{#if calc.mostra.faq}}<script type="application/ld+json">{{ calc.ld_faq | raw }}</script>{{/if}}
<meta property="og:type" content="website">
<meta name="theme-color" content="{{ calc.cor_escura }}">
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Barlow:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
{{ calc.cores | raw }}
<style>
body{margin:0}
a{color:var(--brand-ink)}a:hover{color:var(--ink)}
.hz{background:repeating-linear-gradient(-45deg,var(--c-destaque) 0 18px,#14201a 18px 36px)}
.btn-main:hover{background:var(--c-escura) !important;color:#ffffff !important}
.btn-ghost:hover{background:rgba(255,255,255,0.12) !important;color:#ffffff !important}
.nav a:hover{color:var(--brand-ink)}
.card-img{transition:transform .4s ease}
.card:hover .card-img{transform:scale(1.04)}

html{scroll-behavior:smooth;scroll-padding-top:90px}
*{box-sizing:border-box}
img{max-width:100%}
.site-header{position:sticky;top:0;z-index:20;background:var(--hdr);border-bottom:1px solid var(--line);font-family:'Barlow',system-ui,sans-serif}
.hdr{max-width:1240px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand img{height:52px;width:auto;display:block}
.nav{display:flex;align-items:center;gap:28px;font-weight:600;font-size:15px}
.nav a{color:var(--ink);text-decoration:none;padding:10px 0}
.nav a[aria-current=page]{color:var(--brand-ink);box-shadow:inset 0 -2px var(--brand-ink)}
.nav a.wa{background:var(--c-principal);color:var(--c-principal-txt);padding:12px 20px;border-radius:6px;display:inline-flex;align-items:center;gap:8px}
.menu-btn{display:none;background:none;border:0;color:var(--ink);width:48px;height:48px;align-items:center;justify-content:center;border-radius:6px;cursor:pointer}
.wa-float{position:fixed;right:18px;bottom:18px;z-index:30;width:60px;height:60px;border-radius:50%;background:var(--c-principal);color:var(--c-principal-txt);display:none;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}
@media (max-width:900px){
 .menu-btn{display:inline-flex}
 .brand img{height:44px}
 .nav{display:none;position:absolute;left:0;right:0;top:100%;background:var(--surface);flex-direction:column;align-items:stretch;gap:0;padding:8px 24px 20px;border-bottom:1px solid var(--line);box-shadow:0 10px 24px rgba(0,0,0,.08)}
 .nav.open{display:flex}
 .nav a{padding:14px 0;border-bottom:1px solid var(--line);font-size:17px}
 .nav a.wa{justify-content:center;margin-top:14px;border-bottom:0}
 .wa-float{display:flex}
}
@media (max-width:600px){
 section img[style*="height: 480px"],section video[style*="height: 480px"],section img[style*="height: 520px"]{height:300px !important}
}
</style>
<script>(function(){var t;try{t=localStorage.getItem('segben-theme')}catch(e){}if(!t)t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';var d=document.documentElement;d.setAttribute('data-theme',t);d.classList.add('js')})()</script>
<link rel="stylesheet" href="assets/theme.css">
<link rel="stylesheet" href="assets/anim.css">
<link rel="stylesheet" href="assets/chat.css">
<link rel="stylesheet" href="assets/estilos.css">
</head>
<body>
<div style="font-family: 'Barlow', system-ui, sans-serif; color: var(--ink); background: var(--surface); min-height: 100%;">

{{ calc.header | raw }}

{{ calc.secoes | raw }}

{{ calc.footer | raw }}

</div>
<a class="wa-float" href="https://wa.me/{{ wa }}" aria-label="Falar no WhatsApp"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.4A8.4 8.4 0 1 1 21 11.5z"></path></svg></a>
<script>
(function(){var b=document.querySelector('.menu-btn'),n=document.getElementById('menu');
b.addEventListener('click',function(){var o=n.classList.toggle('open');b.setAttribute('aria-expanded',o);b.setAttribute('aria-label',o?'Fechar menu':'Abrir menu')});
n.addEventListener('click',function(e){if(e.target.closest('a')){n.classList.remove('open');b.setAttribute('aria-expanded','false')}});})();
</script>
<script src="assets/anim.js" defer></script>
<script src="assets/chat.js" defer></script>
</body>
</html>
