cursos:
  - codigo: NR-35
    nome: Trabalho em altura
    pagina: curso-nr-35
    codigo_no_titulo: true
    foto: img/nr35.webp
    home: true
    nome_curto: ""
    resumo: Cinto paraquedista, ancoragem, checklist de EPI e resgate.
    foto_descricao: Turma de trabalho em altura com cintos paraquedistas
    descricao: Pra quem trabalha acima de 2 metros do nível inferior, onde existe risco de queda.
    carga_horaria: 8 horas, teoria e prática
    validade: A cada 2 anos, com 8 horas
    observacao: Também precisa refazer quando muda o procedimento ou a empresa, depois de um acidente ou quando o trabalhador volta de afastamento maior que 90 dias.
    publico:
      - Equipes de manutenção, montagem e instalação
      - Quem trabalha em telhado, estrutura, andaime, escada ou plataforma
      - Logística, construção civil e indústria
    conteudo:
      - Normas e regulamentos do trabalho em altura
      - Análise de risco e condições que impedem o trabalho
      - Riscos do trabalho em altura e como prevenir
      - "Proteção coletiva: sistemas, equipamentos e procedimentos"
      - "EPI: escolha, inspeção, conservação e limites de uso"
      - Acidentes típicos em altura
      - Conduta em emergência, noções de resgate e primeiros socorros
    pratica: Na prática, cada participante veste, ajusta e inspeciona o cinto paraquedista e usa os sistemas de ancoragem.
  - codigo: NR-33
    nome: Espaço confinado
    pagina: curso-nr-33
    codigo_no_titulo: true
    foto: img/nr33.webp
    home: true
    nome_curto: ""
    resumo: Medição de gases com detector multigás, sinalização e entrada segura.
    foto_descricao: Boca de visita sendo avaliada antes de entrada em espaço confinado
    descricao: Pra quem entra, vigia ou supervisiona trabalho em tanque, silo, galeria, poço, boca de visita e outros espaços confinados.
    carga_horaria: 16 horas pra trabalhador autorizado e vigia, 40 horas pra supervisor de entrada
    validade: Todo ano, com 8 horas
    observacao: A capacitação também precisa ser refeita quando muda o procedimento ou depois de um acidente no espaço confinado.
    publico:
      - Trabalhador autorizado
      - Vigia
      - Supervisor de entrada
    conteudo:
      - Definição e identificação de espaços confinados
      - Reconhecimento, avaliação e controle de riscos
      - Funcionamento dos equipamentos, como o detector multigás
      - Procedimentos e uso da Permissão de Entrada e Trabalho (PET)
      - Noções de resgate e primeiros socorros
    pratica: Na prática, a turma faz a medição de gases com detector multigás, a sinalização da área e simula a entrada com a PET preenchida.
  - codigo: NR-11
    nome: Empilhadeira e movimentação de carga
