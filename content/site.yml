    titulo: Sua equipe pronta antes da emergência acontecer.
    texto: Somos credenciados junto ao Corpo de Bombeiros Militar do Estado de Goiás pra ministrar o treinamento de brigada de incêndio, com extintor, mangueira e fogo real no pátio da sua empresa.
    imagem: img/brigada.webp
    imagem_descricao: Brigadistas manuseando mangueira de incêndio em treinamento
    niveis:
      - nome: Brigada básica
        horas: 4 horas
      - nome: Brigada intermediária
        horas: 8 horas
      - nome: Brigada avançada
        horas: 24 horas
    botao: Agendar turma de brigada
  faq:
    etiqueta: Dúvidas
    titulo: Perguntas que todo mundo faz.
    texto: Tem mais respostas na <a href="cursos.html#duvidas">página de cursos</a>, ou <a href="https://wa.me/{whatsapp}">pergunta direto no WhatsApp</a>.
    perguntas:
      - pergunta: O certificado vale na fiscalização?
        resposta: "Vale. O certificado sai com o que a norma pede: nome do trabalhador, conteúdo, carga horária, data, local, instrutor e assinatura do responsável técnico. Junto vão a lista de presença e o registro da parte prática."
      - pergunta: Qual a diferença entre capacitado e autorizado?
        resposta: Capacitado é quem fez o treinamento. Autorizado é quem, além de capacitado e apto no exame médico, recebeu autorização formal da empresa pra fazer aquela atividade. Em NRs como a 10, a 33 e a 35, o trabalhador só pode executar o serviço se estiver autorizado.
      - pergunta: De quanto em quanto tempo precisa reciclar?
        resposta: Depende da norma. A NR-35 pede reciclagem a cada 2 anos, a NR-10 também, e a NR-33 todo ano. Também precisa refazer quando muda o procedimento ou a função, ou quando o trabalhador fica afastado por mais de 90 dias. A gente avisa a empresa quando estiver chegando a hora.
      - pergunta: Vocês fazem o treinamento dentro da minha empresa?
        resposta: Sim. A maior parte das turmas é in company, com a parte prática feita nos equipamentos e no ambiente da própria empresa, o que deixa o treinamento muito mais próximo da realidade do trabalhador. Também organizamos turmas presenciais.
  contato:
